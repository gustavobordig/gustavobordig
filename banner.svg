  <style>
    .tw  { fill:#fff; animation: twinkle ease-in-out infinite; }
    .tw2 { fill:#C4B5FD; animation: twinkle ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .neb { animation: pulse 8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.75 } 50% { opacity:1 } }
    .orbit { transform-origin: 980px 160px; animation: spin 14s linear infinite; }
    .orbit2 { transform-origin: 980px 160px; animation: spin 26s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .shoot { animation: shoot 7s ease-in infinite; opacity:0; }
    @keyframes shoot {
      0%   { transform: translate(0,0); opacity:0 }
      3%   { opacity:1 }
      12%  { transform: translate(420px,140px); opacity:0 }
      100% { transform: translate(420px,140px); opacity:0 }
    }
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .in1 { animation: rise .9s ease-out both; }
    .in2 { animation: rise .9s ease-out .25s both; }
    .in3 { animation: rise .9s ease-out .5s both; }
    @keyframes rise { from { opacity:0; transform: translateY(12px) } to { opacity:1; transform:none } }
    .wave { animation: bob 5s ease-in-out 1.5s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

